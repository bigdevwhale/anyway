name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ANYWAY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "ANYWAY_VERSION=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANYWAY_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anyway.jks"
          echo "ANYWAY_KEYSTORE=$RUNNER_TEMP/anyway.jks" >> "$GITHUB_ENV"

      - name: Require release key for tags
        if: startsWith(github.ref, 'refs/tags/v') && env.ANYWAY_KEYSTORE == ''
        run: echo "::error::Release keystore secrets are missing" && exit 1

      - name: Build
        env:
          ANYWAY_KEYSTORE_PASSWORD: ${{ secrets.ANYWAY_KEYSTORE_PASSWORD }}
          ANYWAY_KEY_ALIAS: ${{ secrets.ANYWAY_KEY_ALIAS }}
          ANYWAY_KEY_PASSWORD: ${{ secrets.ANYWAY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "anyway-${ANYWAY_VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk anyway.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anyway-${{ env.ANYWAY_VERSION }}
          path: anyway-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            anyway-*.apk
            anyway.apk
